name: Build launcher

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      # Reuse the same signing key on every build so updates install over the
      # old version. Gradle creates the key on the first run.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: signing-key-v1
      - run: gradle :launcher:assembleRelease
      - run: cp launcher/build/outputs/apk/release/launcher-release.apk vortrex-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher
          path: vortrex-tv.apk
      # Publishes the APK at a fixed link the TV's Downloader app can open:
      # https://github.com/<owner>/<repo>/releases/download/latest/vortrex-tv.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Vortrex TV" --notes "Latest build of the Vortrex TV launcher." --target "$GITHUB_SHA"
          gh release upload latest vortrex-tv.apk --clobber
